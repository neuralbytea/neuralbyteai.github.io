<body>

  <div class="container">
    <!-- Dynamic Navigation Header -->
    <div id="nav-container"></div>

    <!-- Main Detail Layout Wrapper -->
    <div class="detail-wrap">
      <!-- Main Content Left Pane -->
      <div class="detail-main">
        <div class="proj-banner" id="banner-container">
          <!-- Renders via JS dynamically -->
        </div>
        <div class="img-label">App preview</div>
        <div class="detail-content">
          <span class="back-link" id="back-link">← Back to apps</span>
          <h1 class="detail-title" id="detail-title">App</h1>
          <div class="detail-sub" id="detail-sub">Publisher · Version</div>
          <div class="detail-tags" id="detail-tags">
            <!-- Renders via JS dynamically -->
          </div>

          <div class="sec-lbl">About this app</div>
          <div class="detail-text" id="about-text">
            
          </div>

          <div class="sec-lbl">Key features</div>
          <ul class="feat-list" id="highlights-list">
            <!-- Renders via JS dynamically -->
          </ul>
        </div>
      </div>

      <!-- Detail Sidebar Right Pane -->
      <div class="sidebar">
        <div class="info-block">
          <div class="info-label">Publisher</div>
          <div class="info-val" id="client-val">Client Name</div>
        </div>
        <div class="info-block">
          <div class="info-label">Get it</div>
          <div class="info-val" id="year-val">Year</div>
        </div>
        <div class="info-block" id="version-block">
          <div class="info-label">Odoo version</div>
          <div class="info-val" id="version-val">Odoo Version</div>
        </div>
        <div class="info-block">
          <div class="info-label">Edition · price · licence</div>
          <div class="info-val muted" id="role-val"></div>
        </div>
        <div class="info-block" id="modules-block">
          <div class="info-label">Works with</div>
          <div class="mod-list" id="modules-list">
            <!-- Renders via JS dynamically -->
          </div>
        </div>
        <div class="info-block">
          <div class="info-label">Tech stack</div>
          <div class="mod-list" id="tech-list">
            <!-- Renders via JS dynamically -->
          </div>
        </div>
      </div>
    </div>

    <!-- Details Reusable Bottom Navigation Footer -->
    <div class="nav-footer">
      <span class="nf-btn" id="prev-btn">← Previous app</span>
      <span class="nf-btn" id="next-btn">Next app →</span>
    </div>

    <!-- Shared Footer -->
    <div class="footer" id="footer-container"></div>
  </div>
</body>
